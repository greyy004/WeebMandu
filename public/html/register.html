<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Pokémon World</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1>Create Account</h1>
        <p class="subtitle">Join our community of trainers today</p>
        
        <div id="errorMsg" class="message message-error"></div>
        <div id="successMsg" class="message message-success"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="trainer_gold" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="/html/login.html">Sign in here</a>
        </div>
        
        <div class="mt-4 text-center">
            <a href="/html/landingpage.html" style="font-size: 0.875rem; color: var(--text-muted); text-decoration: none;">&larr; Back to Home</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
